<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Admin</h2>
      <ul>
        <li>Dashboard</li>
        <li>Products</li>
        <li>Orders</li>
        <li>Customers</li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main">

      <!-- Top Bar -->
      <div class="topbar">
        <h1>Dashboard</h1>
        <input type="text" placeholder="Search...">
      </div>

      <!-- Stats -->
      <div class="cards">
        <div class="card">Products: 120</div>
        <div class="card">Orders: 45</div>
        <div class="card">Revenue: $5000</div>
      </div>

      <!-- Table -->
      <table>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Status</th>
        </tr>

        <tr>
          <td>Shoes</td>
          <td>$50</td>
          <td>Active</td>
        </tr>

        <tr>
          <td>Watch</td>
          <td>$100</td>
          <td>Inactive</td>
        </tr>

      </table>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
