<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0f766e">
</head>

<body>

  <a class="skip-link" href="#app">Skip to content</a>
  <div id="live" aria-live="polite" aria-atomic="true" class="sr-only" role="status"></div>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        <h2>Store Admin</h2>
      </div>
      <nav class="nav">
        <ul>
          <li data-route="/" role="button" tabindex="0">Dashboard</li>
          <li data-route="/products" role="button" tabindex="0">Products</li>
          <li data-route="/orders" role="button" tabindex="0">Orders</li>
          <li data-route="/customers" role="button" tabindex="0">Customers</li>
          <!-- Analytics removed per request -->
        </ul>
      </nav>
      <div class="theme-toggle">
        <button id="toggle-theme">Toggle Theme</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button id="hamburger" class="hamburger" aria-label="Open menu" aria-expanded="false">☰</button>
        <div class="search">
          <input id="global-search" type="search" placeholder="Search products, orders, customers...">
        </div>
        <div class="top-actions">
          <button id="new-item">New</button>
        </div>
      </header>

      <main id="app" class="main">
        <!-- SPA content will be rendered here -->
      </main>

      <!-- Modal for forms -->
      <div id="modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="form-title">
        <div class="modal-backdrop"></div>
        <div class="modal-panel">
          <button id="modal-close" class="modal-close">✕</button>
          <form id="product-form">
            <h3 id="form-title">New Product</h3>
            <input type="hidden" id="product-id">
            <label>Title<input id="product-title" required></label>
            <label>Price<input id="product-price" type="number" step="0.01" required></label>
            <label>Stock<input id="product-stock" type="number" required></label>
            <label>Status
              <select id="product-status">
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </label>
            <label>Image URL (optional)
              <input id="product-image" placeholder="https://picsum.photos/id/XXX/600">
            </label>
            <div class="form-actions">
              <button type="submit" class="btn-primary">Save</button>
              <button type="button" id="modal-cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Customer Modal -->
      <div id="customer-modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="customer-form-title">
        <div class="modal-backdrop"></div>
        <div class="modal-panel">
          <button id="customer-modal-close" class="modal-close">✕</button>
          <form id="customer-form">
            <h3 id="customer-form-title">New Customer</h3>
            <input type="hidden" id="customer-id">
            <label>Name<input id="customer-name" required></label>
            <label>Email<input id="customer-email" type="email" required></label>
            <label>Orders<input id="customer-orders" type="number" min="0" value="0"></label>
            <div class="form-actions">
              <button type="submit" class="btn-primary">Save</button>
              <button type="button" id="customer-modal-cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <footer class="footer">© <span id="year"></span> Store Admin</footer>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
